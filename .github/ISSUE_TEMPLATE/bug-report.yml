name: Bug report
description: 誤検知、クラッシュ、出力不整合を報告する
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ddd-lens version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順または最小リポジトリ
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
