name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Self assessment
        run: node dist/cli.js scan . --format markdown --output ddd-lens-self-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: ddd-lens-self-report
          path: ddd-lens-self-report.md
